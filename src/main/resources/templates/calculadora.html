<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>

    <h1>Calculadora</h1>

    <form id = "calculadoraForm">

        <label>Numero1</label>
        <input type = "number" id = "num1" placeholder = "Numero 1" required>
        <br>
        <br>
        <label>Numero2</label>
        <input type = "number" id = "num2" placeholder = "Numero 2" required>
        <br>
        <p id = "resultado">Resultado = 0</p>
        <br>
        <input type = "button" id = "sumar" value = "sumar" onclick = "suma()">
        <input type = "button" id = "restar" value = "restar" onclick = "resta()">
        <input type = "button" id = "multiplicar " value = "multiplicar" onclick = "multiplicacion()">
        <input type = "button" id = "division" value = "division" onclick = "dividir()">
    </form>
    <script src ="/js/calculadora.js"></script>
</body>
</html>
